<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Luis Moreno-Torres — Software Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        oklch(0.16 0.015 250);
    --bg-elev:   oklch(0.20 0.018 250);
    --bg-card:   oklch(0.23 0.020 250);
    --line:      oklch(0.30 0.020 250);
    --line-soft: oklch(0.26 0.018 250);
    --text:      oklch(0.96 0.01 250);
    --muted:     oklch(0.66 0.02 250);
    --dim:       oklch(0.50 0.02 250);

    --lime:      oklch(0.88 0.22 130);
    --magenta:   oklch(0.72 0.26 340);
    --cyan:      oklch(0.82 0.14 220);
    --amber:     oklch(0.82 0.16 75);

    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Inter", system-ui, -apple-system, sans-serif;

    --maxw: 1240px;
    --pad: clamp(20px, 4vw, 56px);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
  }

  /* subtle grid + scanline texture */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(to right, oklch(0.30 0.02 250 / 0.20) 1px, transparent 1px),
      linear-gradient(to bottom, oklch(0.30 0.02 250 / 0.20) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at top, black 30%, transparent 90%);
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 90% -10%, oklch(0.72 0.26 340 / 0.10), transparent 40%),
      radial-gradient(circle at -10% 80%, oklch(0.88 0.22 130 / 0.08), transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  main, header, footer { position: relative; z-index: 1; }

  /* ====== TOP CHROME ====== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    backdrop-filter: blur(14px);
    background: oklch(0.16 0.015 250 / 0.72);
    border-bottom: 1px solid var(--line-soft);
  }
  .topbar-inner {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 14px var(--pad);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
  }
  .brand-mark {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
    letter-spacing: 0.02em;
  }
  .brand-mark .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 12px var(--lime), 0 0 0 3px oklch(0.88 0.22 130 / 0.18);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.85); }
  }
  .brand-mark strong { color: var(--text); font-weight: 600; }

  .top-actions { display: flex; align-items: center; gap: 8px; }

  .lang-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--bg-elev);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
  }
  .lang-toggle button {
    appearance: none;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.06em;
  }
  .lang-toggle button.active {
    background: var(--text);
    color: var(--bg);
  }

  .cv-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: var(--lime);
    color: oklch(0.18 0.04 130);
    border: 1px solid var(--lime);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .cv-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 0 4px oklch(0.88 0.22 130 / 0.18);
  }
  .cv-btn svg { width: 13px; height: 13px; }

  /* ====== LAYOUT ====== */
  main {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 var(--pad);
  }

  .section {
    padding: 120px 0 60px;
    border-top: 1px dashed var(--line-soft);
    position: relative;
  }
  .section:first-of-type { border-top: none; padding-top: 130px; }

  .section-tag {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.04em;
    margin-bottom: 28px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-tag::before {
    content: ""; width: 24px; height: 1px; background: var(--lime);
  }
  .section-tag .num { color: var(--lime); }
  .section-tag .slash { color: var(--muted); }

  .section-title {
    font-family: var(--sans);
    font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0 0 8px;
    max-width: 24ch;
  }
  .section-sub {
    color: var(--muted);
    max-width: 60ch;
    margin: 0 0 40px;
    font-size: 15px;
  }

  /* ====== HERO ====== */
  .hero { padding-top: 110px; padding-bottom: 100px; border: none; }

  .hero-meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    margin-bottom: 28px;
    display: flex; flex-wrap: wrap; gap: 14px 24px;
  }
  .hero-meta span { display: inline-flex; align-items: center; gap: 6px; }
  .hero-meta .key { color: var(--lime); }
  .hero-meta .val { color: var(--text); }

  h1.hero-name {
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(40px, 7.5vw, 116px);
    line-height: 0.95;
    letter-spacing: -0.04em;
    margin: 0 0 24px;
    color: var(--text);
  }
  h1.hero-name .accent {
    background: linear-gradient(135deg, var(--lime), var(--magenta));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-style: italic;
    font-weight: 600;
  }

  .hero-grid {
    display: grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 56px;
    align-items: end;
    margin-top: 56px;
  }
  @media (max-width: 880px) {
    .hero-grid { grid-template-columns: 1fr; gap: 32px; }
  }

  .hero-bio {
    color: var(--muted);
    font-size: 17px;
    line-height: 1.6;
    max-width: 52ch;
  }
  .hero-bio strong { color: var(--text); font-weight: 500; }

  /* terminal */
  .terminal {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    font-family: var(--mono);
    font-size: 13px;
    box-shadow:
      0 30px 60px -20px oklch(0 0 0 / 0.5),
      0 0 0 1px oklch(0.88 0.22 130 / 0.06);
  }
  .terminal-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--line-soft);
  }
  .terminal-bar .lights { display: flex; gap: 6px; margin-right: 10px; }
  .terminal-bar .lights span {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--line);
  }
  .terminal-bar .lights span:nth-child(1) { background: oklch(0.65 0.18 25); }
  .terminal-bar .lights span:nth-child(2) { background: oklch(0.78 0.16 75); }
  .terminal-bar .lights span:nth-child(3) { background: oklch(0.78 0.18 145); }
  .terminal-bar .title {
    color: var(--muted); font-size: 11px;
    flex: 1; text-align: center;
    letter-spacing: 0.02em;
  }
  .terminal-body {
    padding: 18px 18px 22px;
    min-height: 220px;
    color: var(--muted);
    line-height: 1.7;
  }
  .terminal-body .prompt { color: var(--lime); }
  .terminal-body .cmd { color: var(--text); }
  .terminal-body .out { color: var(--muted); }
  .terminal-body .key { color: var(--magenta); }
  .terminal-body .str { color: var(--amber); }
  .terminal-body .comment { color: var(--dim); font-style: italic; }
  .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--lime);
    vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ====== ABOUT ====== */
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
  }
  @media (max-width: 760px) { .about-grid { grid-template-columns: 1fr; gap: 32px; } }
  .about-grid p {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 16px;
    line-height: 1.7;
  }
  .about-grid p strong { color: var(--text); font-weight: 500; }

  /* ====== NOW ====== */
  .now-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px 36px 32px;
    position: relative;
    overflow: hidden;
  }
  .now-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, var(--lime), var(--magenta));
  }
  .now-header {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--lime);
    margin-bottom: 18px;
    letter-spacing: 0.04em;
  }
  .now-header .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--lime);
    animation: pulse 2s ease-in-out infinite;
  }
  .now-card h3 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }
  .now-card p {
    color: var(--muted);
    margin: 0 0 20px;
    max-width: 60ch;
    font-size: 15px;
    line-height: 1.7;
  }
  .now-list {
    list-style: none; padding: 0; margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .now-list li {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    padding: 10px 14px;
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    display: flex; align-items: center; gap: 10px;
  }
  .now-list li::before {
    content: "▸";
    color: var(--lime);
  }

  /* ====== EXPERIENCE / TIMELINE ====== */
  .timeline {
    position: relative;
    padding-left: 28px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 7px; top: 8px; bottom: 8px;
    width: 1px;
    background: linear-gradient(to bottom, var(--line), transparent);
  }
  .tl-item {
    position: relative;
    padding-bottom: 36px;
  }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-item::before {
    content: "";
    position: absolute;
    left: -25px; top: 6px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--lime);
    box-shadow: 0 0 0 4px oklch(0.16 0.015 250);
  }
  .tl-item.is-current::before {
    background: var(--lime);
    box-shadow: 0 0 0 4px oklch(0.16 0.015 250), 0 0 16px var(--lime);
  }
  .tl-period {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .tl-title {
    font-size: 18px; font-weight: 600;
    margin: 0 0 4px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .tl-title .org { color: var(--lime); }
  .tl-title .pill {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 3px 8px;
    border-radius: 999px;
    background: oklch(0.88 0.22 130 / 0.14);
    color: var(--lime);
    border: 1px solid oklch(0.88 0.22 130 / 0.3);
    text-transform: uppercase;
    font-weight: 600;
  }
  .tl-summary {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
    max-width: 64ch;
    line-height: 1.65;
  }

  /* ====== PROJECTS ====== */
  .projects-state {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    padding: 18px 0;
  }
  .projects-state .err { color: var(--magenta); }
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .repo-card {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 22px 20px;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
    transition: border-color 160ms ease, transform 160ms ease;
  }
  .repo-card:hover {
    border-color: var(--lime);
    transform: translateY(-2px);
  }
  .repo-card::after {
    content: "→";
    position: absolute;
    top: 22px; right: 22px;
    color: var(--dim);
    font-size: 16px;
    transition: transform 160ms ease, color 160ms ease;
  }
  .repo-card:hover::after {
    color: var(--lime);
    transform: translate(2px, -2px);
  }
  .repo-name {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
    padding-right: 24px;
  }
  .repo-desc {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
    line-height: 1.55;
    flex: 1;
  }
  .repo-meta {
    display: flex; align-items: center; gap: 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px dashed var(--line-soft);
  }
  .repo-meta .lang {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted);
  }
  .repo-meta .lang .swatch {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--lime);
  }
  .repo-meta .stat { display: inline-flex; align-items: center; gap: 4px; }

  /* ====== SKILLS ====== */
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }
  .skill-group {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
  }
  .skill-group h4 {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--lime);
    margin: 0 0 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .skill-list {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .skill-list li {
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    color: var(--muted);
  }
  .skill-list li.lang-tag { color: var(--text); border-color: var(--line); }

  /* ====== AI TOOLS ====== */
  .ai-row {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin-top: 8px;
  }
  .ai-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  .ai-chip .glyph {
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    color: var(--bg);
  }

  /* ====== CONTACT ====== */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    align-items: start;
  }
  @media (max-width: 820px) { .contact-grid { grid-template-columns: 1fr; gap: 32px; } }

  .contact-info p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.7;
    margin: 0 0 20px;
    max-width: 48ch;
  }
  .contact-links {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 12px;
  }
  .contact-links a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 14px;
    transition: border-color 140ms ease, transform 140ms ease;
  }
  .contact-links a:hover {
    border-color: var(--lime);
    transform: translateX(2px);
  }
  .contact-links a .label { color: var(--dim); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 2px; }
  .contact-links a .val { color: var(--text); }
  .contact-links a .arrow { color: var(--lime); }

  form.contact-form {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  form.contact-form label {
    display: flex; flex-direction: column; gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  form.contact-form input,
  form.contact-form textarea {
    background: var(--bg-card);
    border: 1px solid var(--line-soft);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    text-transform: none;
    letter-spacing: normal;
    transition: border-color 120ms ease;
  }
  form.contact-form input:focus,
  form.contact-form textarea:focus {
    outline: none;
    border-color: var(--lime);
    box-shadow: 0 0 0 3px oklch(0.88 0.22 130 / 0.18);
  }
  form.contact-form textarea {
    resize: vertical;
    min-height: 120px;
    font-family: var(--sans);
  }
  form.contact-form button {
    appearance: none;
    margin-top: 6px;
    padding: 12px 18px;
    background: var(--lime);
    color: oklch(0.18 0.04 130);
    border: none;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  form.contact-form button:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 0 4px oklch(0.88 0.22 130 / 0.18);
  }
  form.contact-form button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .form-msg { font-family: var(--mono); font-size: 12px; }
  .form-msg.ok { color: var(--lime); }
  .form-msg.err { color: var(--magenta); }

  /* ====== FOOTER ====== */
  footer {
    border-top: 1px dashed var(--line-soft);
    margin-top: 80px;
    padding: 36px var(--pad) 48px;
    max-width: var(--maxw);
    margin-left: auto; margin-right: auto;
  }
  .footer-inner {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
  }
  .footer-inner .sig { color: var(--muted); }
  .footer-inner .sig span { color: var(--lime); }

  /* responsive scrollbar treatment */
  ::selection { background: oklch(0.88 0.22 130 / 0.4); color: var(--text); }
</style>
</head>
<body>

<!-- Netlify form detection: this static form is parsed at build time so the
     form-handling endpoint exists. The real, styled form is rendered by React. -->
<form name="contact" netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="subject" />
  <textarea name="message"></textarea>
  <input type="text" name="bot-field" />
</form>
